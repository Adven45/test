    <label>Patient Name</label>
    <input type="text" name="name" id="name">
    <label>MH NO</label>
    <input type="text" name="ID" id="ID">
    <button type="button" id="add">Search</button>
    <label>from date</label>

    <label>to date</label>

     <script>
      document.getElementById('add').addEventListener('click', function() {
        let inputName = document.getElementById('name').value.toLowerCase();  // Corrected to toLowerCase()
        let rows = document.querySelectorAll('table tr');
        let found = false;

        for (let i = 1; i < rows.length; i++) {  // Start from index 1 to skip the header row
            let cells = rows[i].getElementsByTagName('td');
            if (cells.length > 0) {
                let patientname = cells[0].textContent.toLowerCase();  // Make sure the patient name is in lowercase
                if (patientname.includes(inputName)) {
                    rows[i].style.display = "";  // Show the row
                    found = true;
                } else {
                    rows[i].style.display = "none";  // Hide the row
                }
            }
        }

        if (!found) {  // Corrected condition to check if no matching patient was found
            alert("No patient found");
        }

      });

    }
    </script>
